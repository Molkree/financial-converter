[project]
name = "money-manager-to-firefly-iii-converter"
version = "0.1.0"
description = "Converter from Money Manager Android app export to Firefly III format"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx2==2.12.0",
    "openpyxl==3.1.5",
    "pandas-stubs==3.0.5.260730",
    "pandas==3.0.5",
    "pydantic-extra-types[pycountry]==2.11.1",
    "pydantic-settings==2.15.0",
    "pydantic==2.13.5",
    "streamlit==1.63.0",
    "typer==0.27.2",
]

[dependency-groups]
build = ["uv==0.12.13"]
dev = [
    "black==26.5.1",
    "flake8-bugbear==26.9.9",
    "Flake8-pyproject==1.2.4",
    "flake8==7.3.0",
    "isort==9.0.1",
    "mypy==2.3.1",
    "pep8-naming==0.15.1",
    "prek==0.5.2",
    "types-openpyxl==3.1.5.20260827",
]

[tool.uv]
exclude-newer = "1 week"

[tool.flake8]
max-line-length = 80
extend-select = ["B950"]
extend-ignore = ["E203", "E501", "E701"]

[tool.isort]
profile = "black"

[tool.mypy]
plugins = ['pydantic.mypy']
