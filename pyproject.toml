[project]
name = "money-manager-to-firefly-iii-converter"
version = "0.1.0"
description = "Converter from Money Manager Android app export to Firefly III format"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "httpx2==2.16.0",
    "openpyxl==3.1.5",
    "pandas-stubs==3.1.0.261029",
    "pandas==3.1.0",
    "pydantic-extra-types[pycountry]==2.11.1",
    "pydantic-settings==2.16.2",
    "pydantic==2.14.2",
    "streamlit[performance]==1.66.1",
    "typer==0.27.3",
]

[dependency-groups]
build = ["uv==0.13.6"]
dev = [
    "black==26.10.1",
    "flake8-bugbear==26.10.27",
    "Flake8-pyproject==1.2.4",
    "flake8==7.5.0",
    "isort==9.0.2",
    "mypy==2.4.1",
    "pep8-naming==0.15.1",
    "prek==0.5.9",
    "types-openpyxl==3.1.5.20261017",
]

[tool.uv]
exclude-newer = "1 week"

[tool.flake8]
max-line-length = 80
extend-select = ["B950"]
extend-ignore = ["E203", "E501", "E701"]

[tool.isort]
profile = "black"

[tool.mypy]
plugins = ['pydantic.mypy']
