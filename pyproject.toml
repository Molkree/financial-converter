[project]
name = "money-manager-to-firefly-iii-converter"
version = "0.1.0"
description = "Converter from Money Manager Android app export to Firefly III format"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "httpx2==2.16.0",
    "openpyxl==3.1.5",
    "pandas-stubs==3.1.0.261029",
    "pandas==3.1.0",
    "pydantic-extra-types[pycountry]==2.11.1",
    "pydantic-settings==2.16.2",
    "pydantic==2.14.2",
    "streamlit[performance]==1.66.1",
    "typer==0.27.3",
]

[dependency-groups]
build = ["uv==0.13.6"]
dev = [
    "mypy==2.4.1",
    "prek==0.5.9",
    "ruff==0.17.3",
    "types-openpyxl==3.1.5.20261017",
]

[tool.uv]
exclude-newer = "1 week"

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
ignore = ["E203", "E701"]
select = [
    # pycodestyle
    "E", "W",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-bandit
    "S",
    # pep8-naming
    "N",
    # Ruff
    "RUF",
]

[tool.mypy]
plugins = ['pydantic.mypy']
